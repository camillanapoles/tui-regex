[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team-builder-wasm"
version = "2.0.0"
description = "Plataforma de times de agentes autônomos: FSM + Gates (UUID PK) + Factory Pattern + sandbox Wasmtime (fuel/epoch) + FastAPI + Pydantic/Instructor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "camillanapoles" }]
keywords = ["wasm", "wasmtime", "agents", "fsm", "fastapi", "factory-pattern"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "wasmtime>=49.0.0",
    "openai>=1.40",
    "instructor>=1.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["team_builder*"]
