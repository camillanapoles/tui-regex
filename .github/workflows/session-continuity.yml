name: Session Continuity

# ─────────────────────────────────────────────────────────────────────────
# Continuidade da sessão garantida por CI/CD (sobrevive ao fim da sessão).
#
# Gatilhos:
#   * push em `main`  → dispara automaticamente quando o PR da sessão é
#     mesclado (eventos de push são entregues pelo webhook nativo do GitHub)
#   * workflow_dispatch → gatilho manual ("via GH"):
#       gh workflow run session-continuity.yml [--ref <branch>]
#
# O que garante:
#   1. Gate: handoff só é gerado com o estado VERDE (WAT válido + 158 testes)
#   2. Contexto: docs/handoff/SESSION_HANDOFF.md gerado de forma
#      DETERMINÍSTICA a partir do repositório (git + snapshot de continuidade
#      commitado) — nenhum contexto vive só no chat
#   3. Branch: cria `handoff/<sha>-<data>` no MESMO repositório e faz push
#   4. Retomada: abre (ou atualiza) um DRAFT PR com as instruções de
#      retomada — a próxima janela/sessão (second way) continua a partir dele
# ─────────────────────────────────────────────────────────────────────────
on:
  push:
    # Dispara no merge da sessão em `main` (webhook nativo do GitHub).
    # (Este workflow também pode ser disparado manualmente — "via GH" — com:
    #    gh workflow run session-continuity.yml [--ref <branch>])
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  handoff:
    name: gate-verde + handoff + branch + draft-PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependências
        run: pip install -r requirements.txt

      - name: "Gate: handoff só com estado verde (CI/CD completo)"
        run: |
          python scripts/validate_wat.py
          pytest -q

      - name: "Gerar contexto de handoff (determinístico, a partir do repo)"
        run: python scripts/generate_handoff.py --out docs/handoff/SESSION_HANDOFF.md

      - name: "Criar branch de continuidade no mesmo repositório + push"
        id: branch
        run: |
          SHORT=$(git rev-parse --short HEAD)
          BR="handoff/${SHORT}-$(date -u +%Y%m%d-%H%M)"
          git config user.name "session-continuity[bot]"
          git config user.email "session-continuity@users.noreply.github.com"
          git checkout -b "$BR"
          git add docs/handoff/SESSION_HANDOFF.md
          git commit -m "continuity: handoff da sessão @ ${SHORT} (ponto de retomada da próxima janela)"
          git push origin "$BR"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"

      - name: "Abrir (ou atualizar) draft PR de retomada (REST puro + auto-diagnóstico)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export BR="${{ steps.branch.outputs.branch }}"
          export BASE="${{ github.ref_name }}"
          export SHORT="$(git rev-parse --short HEAD)"
          # pequeno intervalo p/ propagação do branch recém-empurrado
          sleep 5
          rc=0
          python3 - <<'PY' 2>/tmp/pr_step_error.txt || rc=$?
          import json, os, urllib.error, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repo}"
          handoff = open("docs/handoff/SESSION_HANDOFF.md", encoding="utf-8").read()

          def call(method: str, path: str, payload: dict | None = None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(
                  api + path, data=data, method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return json.loads(resp.read() or b"null")
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode(errors="replace")
                  exc.body = body  # anexa p/ quem tratá-la depois (read só funciona 1x)
                  print(f"HTTP {exc.code} {exc.reason} em {method} {exc.url}")
                  print("response body:", body[:2000])
                  raise

          # 1) idempotência: PRs abertos com o mesmo head (REST puro — sem GraphQL)
          owner = repo.split("/", 1)[0]
          open_prs = call("GET", f"/pulls?head={owner}:{os.environ['BR']}&state=open")
          if open_prs:
              existing = open_prs[0]
              call("PATCH", f"/pulls/{existing['number']}", {"body": handoff})
              print(f"PR de retomada atualizado: #{existing['number']} {existing['html_url']}")
          else:
              try:
                  pr = call("POST", "/pulls", {
                      "base": os.environ["BASE"],
                      "head": os.environ["BR"],
                      "draft": True,
                      "title": f"🔁 Continuity: handoff da sessão @ {os.environ['SHORT']}",
                      "body": handoff,
                  })
                  print(f"Draft PR de retomada criado: #{pr['number']} {pr['html_url']}")
              except urllib.error.HTTPError as exc:
                  body = getattr(exc, "body", "")
                  # 403/404: o toggle 'Allow GitHub Actions to create and update
                  # pull requests' está desligado (ou token sem permissão).
                  # A CONTINUIDADE NÃO É AFETADA: o branch de handoff já foi
                  # criado com o contexto completo e roda o CI. O PR é conveniência.
                  if exc.code in (403, 404):
                      note = (
                          "DRAFT PR NÃO CRIADO (token do runner sem permissão de escrita em PRs)\n\n"
                          f"O branch de handoff `{os.environ['BR']}` ESTÁ PRONTO e é o ponto de "
                          "retomada:\n"
                          "  1. abra o branch no GitHub e use 'Compare & pull request' (1 clique), OU\n"
                          "  2. ative: Settings → Actions → General →\n"
                          "     'Allow GitHub Actions to create and update pull requests'\n"
                          "     → na próxima execução este passo cria o draft PR automaticamente\n\n"
                          f"(HTTP {exc.code} em POST /pulls; GET /pulls funcionou — é só a escrita)\n\n"
                          f"--- corpo da resposta HTTP {exc.code} ---\n{body[:1500]}\n"
                      )
                      with open("docs/handoff/PR_CREATION_BLOCKED.txt", "w", encoding="utf-8") as fh:
                          fh.write(note)
                      print("AVISO: draft PR bloqueado; nota publicada no branch de handoff (continuidade OK)")
                  else:
                      raise
          PY
          if [ "$rc" -eq 0 ]; then
            # se o passo de PR deixou uma nota de bloqueio, publicá-la no branch
            if [ -f docs/handoff/PR_CREATION_BLOCKED.txt ]; then
              git add docs/handoff/PR_CREATION_BLOCKED.txt
              git commit -m "continuity: nota — draft PR pendente de permissão de Actions" || true
              git push origin "$BR" || true
            fi
            exit 0
          fi
          # falha: publica o diagnóstico (c/ stderr do python) NO branch de handoff
          {
            printf 'DIAGNOSTICO — passo de criação de PR (Session Continuity)\n'
            printf 'run=%s job=%s attempt=%s\n' "${GITHUB_RUN_ID:-?}" "${GITHUB_JOB:-?}" "${GITHUB_RUN_ATTEMPT:-?}"
            printf 'BR=%s BASE=%s repo=%s\n' "$BR" "$BASE" "${GITHUB_REPOSITORY:-?}"
            echo '--- stderr do python ---'
            cat /tmp/pr_step_error.txt 2>/dev/null
          } > docs/handoff/CI_DIAGNOSTICS.txt
          git add docs/handoff/CI_DIAGNOSTICS.txt
          git commit -m "continuity: diagnóstico do passo de PR" || true
          git push origin "$BR" || true
          cat /tmp/pr_step_error.txt 2>/dev/null >&2
          echo "diagnóstico publicado em $BR: docs/handoff/CI_DIAGNOSTICS.txt" >&2
          exit 1
