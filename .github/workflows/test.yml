name: test

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  validate:
    name: "Completude USHub (Node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependências de teste
        run: npm ci --no-audit --no-fund

      - name: 1/4 · Sintaxe dos userscripts
        run: bash tests/syntax.sh

      - name: 2/4 · Validação estática de completude
        run: node tests/validate-static.js

      - name: 3/4 · Suíte funcional principal (jsdom)
        run: node tests/test-main.js

      - name: 4/4 · Casos-limite S1–S8 (jsdom)
        run: node tests/test-edge.js
